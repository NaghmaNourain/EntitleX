name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Restore, build, unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Vulnerable package audit (High+)
        run: |
          set -euo pipefail
          dotnet list EntitleX.sln package --vulnerable --include-transitive --format json > /tmp/vuln.json || true
          if command -v jq >/dev/null 2>&1; then
            high=$(jq -r '
              .. | objects
              | select(has("severity") or has("Severity"))
              | (.severity // .Severity // "")
              | ascii_upcase
              | select(. == "HIGH" or . == "CRITICAL")
            ' /tmp/vuln.json | wc -l)
            if [ "$high" -gt 0 ]; then
              echo "::error::Found High/Critical vulnerable NuGet packages"
              cat /tmp/vuln.json
              exit 1
            fi
          else
            if grep -Eiq '"severity"\s*:\s*"(High|Critical)"' /tmp/vuln.json; then
              echo "::error::Found High/Critical vulnerable NuGet packages"
              cat /tmp/vuln.json
              exit 1
            fi
          fi
          echo "No High/Critical vulnerable packages reported."

      - name: Build
        run: dotnet build EntitleX.sln --configuration Release --no-restore

      - name: Unit tests + coverage
        run: |
          set -euo pipefail
          mkdir -p TestResults/coverage
          dotnet test tests/EntitleX.Domain.UnitTests/EntitleX.Domain.UnitTests.csproj \
            --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
          dotnet test tests/EntitleX.Application.UnitTests/EntitleX.Application.UnitTests.csproj \
            --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
          dotnet test tests/EntitleX.Infrastructure.UnitTests/EntitleX.Infrastructure.UnitTests.csproj \
            --configuration Release --no-build --verbosity normal
          dotnet test tests/CloudShield.Domain.UnitTests/CloudShield.Domain.UnitTests.csproj \
            --configuration Release --no-build --verbosity normal

      - name: Soft coverage floor (Domain / Application)
        # Soft gate: annotate when coverage is below the floor; do not fail the job yet.
        run: |
          set -euo pipefail
          FLOOR=40
          mapfile -t files < <(find TestResults/coverage -name coverage.cobertura.xml 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No cobertura coverage files found (soft floor skipped)."
            exit 0
          fi
          python3 - <<'PY' "$FLOOR" "${files[@]}"
          import sys, xml.etree.ElementTree as ET
          floor = float(sys.argv[1])
          paths = sys.argv[2:]
          line_ok = line_total = 0
          for path in paths:
              root = ET.parse(path).getroot()
              # cobertura root may be coverage with line-rate attr
              rate = root.attrib.get("line-rate")
              if rate is not None:
                  covered = float(rate) * 100
                  print(f"{path}: line-rate={covered:.1f}%")
                  if covered < floor:
                      print(f"::warning::Coverage {covered:.1f}% is below soft floor {floor:.0f}% ({path})")
                  continue
              for cls in root.iter("class"):
                  lines = list(cls.find("lines") or [])
                  for line in lines:
                      line_total += 1
                      if int(line.attrib.get("hits", "0")) > 0:
                          line_ok += 1
          if line_total:
              pct = 100.0 * line_ok / line_total
              print(f"Aggregated line coverage≈{pct:.1f}% ({line_ok}/{line_total})")
              if pct < floor:
                  print(f"::warning::Aggregated coverage {pct:.1f}% is below soft floor {floor:.0f}%")
          PY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/coverage
          if-no-files-found: ignore

      - name: Integration tests
        # Testcontainers tests skip gracefully via DockerFact when Docker is unavailable.
        run: |
          dotnet test tests/EntitleX.Infrastructure.IntegrationTests/EntitleX.Infrastructure.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/CloudShield.Infrastructure.IntegrationTests/CloudShield.Infrastructure.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
          dotnet test tests/EntitleX.Api.Tests/EntitleX.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: E2E scaffolding tests
        # Large 1000-item scenario skips without ENTITLEX_E2E=1 + Compose infra.
        run: |
          dotnet test tests/EntitleX.E2E.Tests/EntitleX.E2E.Tests.csproj --configuration Release --no-build --verbosity normal

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Format verify
        run: dotnet format EntitleX.sln --verify-no-changes --severity warn

      - name: Build with analyzers
        run: dotnet build EntitleX.sln --configuration Release -p:EnforceCodeStyleInBuild=true

      - name: Terraform fmt check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # npm install (not ci) so Vitest/RTL deps added in package.json resolve on Actions
        # even when the lockfile has not been regenerated in this offline agent environment.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docker-images:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.api
          push: false
          load: true
          tags: entitlex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: entitlex-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build OutboxPublisher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.worker
          push: false
          load: true
          tags: entitlex-outbox-publisher:ci
          build-args: |
            PROJECT_PATH=src/workers/EntitleX.OutboxPublisher/EntitleX.OutboxPublisher.csproj
            DLL_NAME=EntitleX.OutboxPublisher.dll

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: entitlex-outbox-publisher:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build CloudShield image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.simulator
          push: false
          load: true
          tags: entitlex-cloudshield:ci
          build-args: |
            PROJECT_PATH=src/simulators/CloudShield/CloudShield.Api/CloudShield.Api.csproj
            DLL_NAME=CloudShield.Api.dll

      - name: Scan simulator image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: entitlex-cloudshield:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.frontend
          push: false
          load: true
          tags: entitlex-frontend:ci

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: entitlex-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
