name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Restore, build, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entitlex
          POSTGRES_PASSWORD: entitlex
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entitlex -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prefer the GHA Postgres service over Testcontainers (nested Docker is unreliable here).
      ENTITLEX_TEST_POSTGRES: Host=localhost;Port=5432;Username=entitlex;Password=entitlex;Database=postgres
      CLOUDSHIELD_TEST_POSTGRES: Host=localhost;Port=5432;Username=entitlex;Password=entitlex;Database=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Build
        run: dotnet build EntitleX.sln --configuration Release --no-restore

      - name: Unit tests
        run: |
          set -euo pipefail
          run_tests() {
            local project="$1"
            local title="$2"
            local log
            log="$(mktemp)"
            set +e
            dotnet test "$project" --configuration Release --no-build --verbosity normal | tee "$log"
            local ec=${PIPESTATUS[0]}
            set -e
            if [ "$ec" -ne 0 ]; then
              echo "::group::Failing test excerpts ($project)"
              grep -E '\[FAIL\]|Failed |Error Message:|Assert\.|Exception:|System\.[A-Za-z]+Exception|Npgsql\.|Serilog|logger is already frozen' "$log" | tail -n 80 \
                | while IFS= read -r line; do
                    echo "::error title=${title}::${line}"
                  done || true
              echo "::endgroup::"
              exit "$ec"
            fi
          }
          run_tests tests/EntitleX.Domain.UnitTests/EntitleX.Domain.UnitTests.csproj "Unit test failure"
          run_tests tests/EntitleX.Application.UnitTests/EntitleX.Application.UnitTests.csproj "Unit test failure"
          run_tests tests/EntitleX.Infrastructure.UnitTests/EntitleX.Infrastructure.UnitTests.csproj "Unit test failure"
          run_tests tests/CloudShield.Domain.UnitTests/CloudShield.Domain.UnitTests.csproj "Unit test failure"

      - name: Integration tests
        # Uses GHA postgres service via ENTITLEX_TEST_POSTGRES / CLOUDSHIELD_TEST_POSTGRES.
        # DockerFact skips cleanly when those env vars are absent (no Testcontainers under CI).
        # On failure, emit compact annotations including failing test names.
        run: |
          set -euo pipefail
          run_tests() {
            local project="$1"
            local log
            log="$(mktemp)"
            set +e
            dotnet test "$project" --configuration Release --no-build --verbosity normal | tee "$log"
            local ec=${PIPESTATUS[0]}
            set -e
            if [ "$ec" -ne 0 ]; then
              echo "::group::Failing test excerpts ($project)"
              grep -E '\[FAIL\]|Failed |Error Message:|Stack Trace:|Assert\.|Exception:|System\.[A-Za-z]+Exception|Npgsql\.|Serilog|logger is already frozen|Failed to connect|Connection refused' "$log" | tail -n 120 \
                | while IFS= read -r line; do
                    echo "::error title=Integration test failure::${line}"
                  done || true
              echo "::endgroup::"
              exit "$ec"
            fi
          }
          run_tests tests/EntitleX.Infrastructure.IntegrationTests/EntitleX.Infrastructure.IntegrationTests.csproj
          run_tests tests/CloudShield.Infrastructure.IntegrationTests/CloudShield.Infrastructure.IntegrationTests.csproj
          run_tests tests/EntitleX.Api.Tests/EntitleX.Api.Tests.csproj

      - name: E2E scaffolding tests
        # Large 1000-item scenario skips without ENTITLEX_E2E=1 + Compose infra.
        run: |
          dotnet test tests/EntitleX.E2E.Tests/EntitleX.E2E.Tests.csproj --configuration Release --no-build --verbosity normal

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Format verify
        # Soft gate: warn on format drift without failing the whole pack if no .editorconfig rules yet.
        run: |
          dotnet format EntitleX.sln --verify-no-changes --severity warn || echo "::warning::dotnet format reported differences (non-blocking soft gate)"

      - name: Build with analyzers
        run: dotnet build EntitleX.sln --configuration Release -p:EnforceCodeStyleInBuild=true

      - name: Terraform fmt check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: terraform fmt
        working-directory: infra/terraform
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::error::terraform fmt -check failed; run 'terraform fmt -recursive' under infra/terraform"
            exit 1
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker-images:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.api
          push: false
          load: true
          tags: entitlex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: entitlex-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build OutboxPublisher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.worker
          push: false
          tags: entitlex-outbox-publisher:ci
          build-args: |
            PROJECT_PATH=src/workers/EntitleX.OutboxPublisher/EntitleX.OutboxPublisher.csproj
            DLL_NAME=EntitleX.OutboxPublisher.dll

      - name: Build CloudShield image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.simulator
          push: false
          tags: entitlex-cloudshield:ci
          build-args: |
            PROJECT_PATH=src/simulators/CloudShield/CloudShield.Api/CloudShield.Api.csproj
            DLL_NAME=CloudShield.Api.dll

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.frontend
          push: false
          tags: entitlex-frontend:ci
