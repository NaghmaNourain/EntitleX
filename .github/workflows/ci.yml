name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Restore, build, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entitlex
          POSTGRES_PASSWORD: entitlex
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entitlex -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prefer the GHA Postgres service over Testcontainers (nested Docker is unreliable here).
      ENTITLEX_TEST_POSTGRES: Host=localhost;Port=5432;Username=entitlex;Password=entitlex;Database=postgres
      CLOUDSHIELD_TEST_POSTGRES: Host=localhost;Port=5432;Username=entitlex;Password=entitlex;Database=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Vulnerable package audit (High+)
        # Soft gate: report High/Critical findings without failing the job so CI stays green
        # while transitive upgrades are staged. Flip to hard-fail once the inventory is clean.
        run: |
          set -euo pipefail
          dotnet list EntitleX.sln package --vulnerable --include-transitive --format json > /tmp/vuln.json || true
          if command -v jq >/dev/null 2>&1; then
            high=$(jq -r '
              .. | objects
              | select(has("severity") or has("Severity"))
              | (.severity // .Severity // "")
              | ascii_upcase
              | select(. == "HIGH" or . == "CRITICAL")
            ' /tmp/vuln.json | wc -l)
            if [ "$high" -gt 0 ]; then
              echo "::warning::Found High/Critical vulnerable NuGet packages (soft gate; see /tmp/vuln.json)"
              cat /tmp/vuln.json
              exit 0
            fi
          else
            if grep -Eiq '"severity"\s*:\s*"(High|Critical)"' /tmp/vuln.json; then
              echo "::warning::Found High/Critical vulnerable NuGet packages (soft gate)"
              cat /tmp/vuln.json
              exit 0
            fi
          fi
          echo "No High/Critical vulnerable packages reported."

      - name: Build
        run: dotnet build EntitleX.sln --configuration Release --no-restore

      - name: Unit tests + coverage
        run: |
          set -euo pipefail
          mkdir -p TestResults/coverage
          run_tests() {
            local project="$1"
            local title="$2"
            local extra=("${@:3}")
            local log
            log="$(mktemp)"
            set +e
            dotnet test "$project" --configuration Release --no-build --verbosity normal "${extra[@]}" | tee "$log"
            local ec=${PIPESTATUS[0]}
            set -e
            if [ "$ec" -ne 0 ]; then
              echo "::group::Failing test excerpts ($project)"
              grep -E '\[FAIL\]|Failed |Error Message:|Assert\.|Exception:|System\.[A-Za-z]+Exception|Npgsql\.|Serilog|logger is already frozen' "$log" | tail -n 80 \
                | while IFS= read -r line; do
                    echo "::error title=${title}::${line}"
                  done || true
              echo "::endgroup::"
              exit "$ec"
            fi
          }
          run_tests tests/EntitleX.Domain.UnitTests/EntitleX.Domain.UnitTests.csproj "Unit test failure" \
            --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
          run_tests tests/EntitleX.Application.UnitTests/EntitleX.Application.UnitTests.csproj "Unit test failure" \
            --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
          run_tests tests/EntitleX.Infrastructure.UnitTests/EntitleX.Infrastructure.UnitTests.csproj "Unit test failure"
          run_tests tests/CloudShield.Domain.UnitTests/CloudShield.Domain.UnitTests.csproj "Unit test failure"

      - name: Soft coverage floor (Domain / Application)
        # Soft gate: annotate when coverage is below the floor; do not fail the job yet.
        run: |
          set -euo pipefail
          FLOOR=40
          mapfile -t files < <(find TestResults/coverage -name coverage.cobertura.xml 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No cobertura coverage files found (soft floor skipped)."
            exit 0
          fi
          python3 - <<'PY' "$FLOOR" "${files[@]}"
          import sys, xml.etree.ElementTree as ET
          floor = float(sys.argv[1])
          paths = sys.argv[2:]
          line_ok = line_total = 0
          for path in paths:
              root = ET.parse(path).getroot()
              # cobertura root may be coverage with line-rate attr
              rate = root.attrib.get("line-rate")
              if rate is not None:
                  covered = float(rate) * 100
                  print(f"{path}: line-rate={covered:.1f}%")
                  if covered < floor:
                      print(f"::warning::Coverage {covered:.1f}% is below soft floor {floor:.0f}% ({path})")
                  continue
              for cls in root.iter("class"):
                  lines = list(cls.find("lines") or [])
                  for line in lines:
                      line_total += 1
                      if int(line.attrib.get("hits", "0")) > 0:
                          line_ok += 1
          if line_total:
              pct = 100.0 * line_ok / line_total
              print(f"Aggregated line coverage≈{pct:.1f}% ({line_ok}/{line_total})")
              if pct < floor:
                  print(f"::warning::Aggregated coverage {pct:.1f}% is below soft floor {floor:.0f}%")
          PY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: TestResults/coverage
          if-no-files-found: ignore

      - name: Integration tests
        # Uses GHA postgres service via ENTITLEX_TEST_POSTGRES / CLOUDSHIELD_TEST_POSTGRES.
        # DockerFact skips cleanly when those env vars are absent (no Testcontainers under CI).
        run: |
          set -euo pipefail
          run_tests() {
            local project="$1"
            local log
            log="$(mktemp)"
            set +e
            dotnet test "$project" --configuration Release --no-build --verbosity normal | tee "$log"
            local ec=${PIPESTATUS[0]}
            set -e
            if [ "$ec" -ne 0 ]; then
              echo "::group::Failing test excerpts ($project)"
              grep -E '\[FAIL\]|Failed |Error Message:|Stack Trace:|Assert\.|Exception:|System\.[A-Za-z]+Exception|Npgsql\.|Serilog|logger is already frozen|Failed to connect|Connection refused' "$log" | tail -n 120 \
                | while IFS= read -r line; do
                    echo "::error title=Integration test failure::${line}"
                  done || true
              echo "::endgroup::"
              exit "$ec"
            fi
          }
          run_tests tests/EntitleX.Infrastructure.IntegrationTests/EntitleX.Infrastructure.IntegrationTests.csproj
          run_tests tests/CloudShield.Infrastructure.IntegrationTests/CloudShield.Infrastructure.IntegrationTests.csproj
          run_tests tests/EntitleX.Api.Tests/EntitleX.Api.Tests.csproj

      - name: E2E scaffolding tests
        # Large 1000-item scenario skips without ENTITLEX_E2E=1 + Compose infra.
        run: |
          dotnet test tests/EntitleX.E2E.Tests/EntitleX.E2E.Tests.csproj --configuration Release --no-build --verbosity normal

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EntitleX.sln

      - name: Format verify
        # Soft gate until format drift across the stack is fully normalized.
        run: |
          if ! dotnet format EntitleX.sln --verify-no-changes --severity warn; then
            echo "::warning::dotnet format reported differences (non-blocking soft gate)"
          fi

      - name: Build with analyzers
        run: dotnet build EntitleX.sln --configuration Release -p:EnforceCodeStyleInBuild=true

      - name: Terraform fmt check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: terraform fmt
        working-directory: infra/terraform
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::error::terraform fmt -check failed; run 'terraform fmt -recursive' under infra/terraform"
            exit 1
          fi

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the OSS CLI — gitleaks-action@v2 requires GITLEAKS_LICENSE on private repos
      # and was failing intermittently on pull_request events without a license secret.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan repository
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-images:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.api
          push: false
          load: true
          tags: entitlex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: entitlex-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build OutboxPublisher image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.worker
          push: false
          load: true
          tags: entitlex-outbox-publisher:ci
          build-args: |
            PROJECT_PATH=src/workers/EntitleX.OutboxPublisher/EntitleX.OutboxPublisher.csproj
            DLL_NAME=EntitleX.OutboxPublisher.dll

      - name: Scan worker image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: entitlex-outbox-publisher:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build CloudShield image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.simulator
          push: false
          load: true
          tags: entitlex-cloudshield:ci
          build-args: |
            PROJECT_PATH=src/simulators/CloudShield/CloudShield.Api/CloudShield.Api.csproj
            DLL_NAME=CloudShield.Api.dll

      - name: Scan simulator image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: entitlex-cloudshield:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.frontend
          push: false
          load: true
          tags: entitlex-frontend:ci

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: entitlex-frontend:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
