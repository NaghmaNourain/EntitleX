name: Deploy AWS (manual)

# Optional gated deploy. Requires repository Environment "aws-lab" (or similar)
# with required reviewers and OIDC role secrets. Does NOT run on push.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name (protection rules / secrets)
        required: true
        default: aws-lab
      apply:
        description: Run terraform apply (false = plan only)
        required: true
        type: boolean
        default: false
      enable_ecs_services:
        description: Pass -var enable_ecs_services
        required: true
        type: boolean
        default: false
      enable_alb:
        description: Pass -var enable_alb (adds ALB cost; default false)
        required: true
        type: boolean
        default: false
      push_images:
        description: Build and push images to ECR before plan/apply
        required: true
        type: boolean
        default: false
      image_tag:
        description: Image tag to push / reference
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  push-images:
    name: Build and push ECR images
    if: ${{ inputs.push_images }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      api: ${{ steps.urls.outputs.api }}
      outbox: ${{ steps.urls.outputs.outbox }}
      fulfillment: ${{ steps.urls.outputs.fulfillment }}
      reconciliation: ${{ steps.urls.outputs.reconciliation }}
      notification: ${{ steps.urls.outputs.notification }}
      cloudshield: ${{ steps.urls.outputs.cloudshield }}
      networkguard: ${{ steps.urls.outputs.networkguard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve repository URLs
        id: urls
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PREFIX: entitlex
          TAG: ${{ inputs.image_tag }}
        run: |
          echo "api=${REGISTRY}/${PREFIX}/api:${TAG}" >> "$GITHUB_OUTPUT"
          echo "outbox=${REGISTRY}/${PREFIX}/outbox:${TAG}" >> "$GITHUB_OUTPUT"
          echo "fulfillment=${REGISTRY}/${PREFIX}/fulfillment:${TAG}" >> "$GITHUB_OUTPUT"
          echo "reconciliation=${REGISTRY}/${PREFIX}/reconciliation:${TAG}" >> "$GITHUB_OUTPUT"
          echo "notification=${REGISTRY}/${PREFIX}/notification:${TAG}" >> "$GITHUB_OUTPUT"
          echo "cloudshield=${REGISTRY}/${PREFIX}/cloudshield:${TAG}" >> "$GITHUB_OUTPUT"
          echo "networkguard=${REGISTRY}/${PREFIX}/networkguard:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repositories exist
        env:
          PREFIX: entitlex
        run: |
          for name in api outbox fulfillment reconciliation notification cloudshield networkguard frontend lambda; do
            aws ecr describe-repositories --repository-names "${PREFIX}/${name}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "${PREFIX}/${name}" --image-scanning-configuration scanOnPush=true
          done

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.api
          push: true
          tags: ${{ steps.urls.outputs.api }}

      - name: Build and push OutboxPublisher
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.worker
          push: true
          tags: ${{ steps.urls.outputs.outbox }}
          build-args: |
            PROJECT_PATH=src/workers/EntitleX.OutboxPublisher/EntitleX.OutboxPublisher.csproj
            DLL_NAME=EntitleX.OutboxPublisher.dll

      - name: Build and push FulfillmentWorker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.worker
          push: true
          tags: ${{ steps.urls.outputs.fulfillment }}
          build-args: |
            PROJECT_PATH=src/workers/EntitleX.FulfillmentWorker/EntitleX.FulfillmentWorker.csproj
            DLL_NAME=EntitleX.FulfillmentWorker.dll

      - name: Build and push CloudShield
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.simulator
          push: true
          tags: ${{ steps.urls.outputs.cloudshield }}
          build-args: |
            PROJECT_PATH=src/simulators/CloudShield/CloudShield.Api/CloudShield.Api.csproj
            DLL_NAME=CloudShield.Api.dll

      - name: Build and push NetworkGuard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/images/Dockerfile.simulator
          push: true
          tags: ${{ steps.urls.outputs.networkguard }}
          build-args: |
            PROJECT_PATH=src/simulators/NetworkGuard/NetworkGuard.Api/NetworkGuard.Api.csproj
            DLL_NAME=NetworkGuard.Api.dll

  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    needs: [push-images]
    if: ${{ always() && (needs.push-images.result == 'success' || needs.push-images.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_container_image_api: ${{ needs.push-images.outputs.api }}
          TF_VAR_container_image_outbox: ${{ needs.push-images.outputs.outbox }}
          TF_VAR_container_image_fulfillment: ${{ needs.push-images.outputs.fulfillment }}
          TF_VAR_container_image_reconciliation: ${{ needs.push-images.outputs.reconciliation }}
          TF_VAR_container_image_notification: ${{ needs.push-images.outputs.notification }}
          TF_VAR_container_image_cloudshield: ${{ needs.push-images.outputs.cloudshield }}
          TF_VAR_container_image_networkguard: ${{ needs.push-images.outputs.networkguard }}
        run: |
          EXTRA_IMAGE_ARGS=()
          if [ -n "${TF_VAR_container_image_api}" ]; then
            EXTRA_IMAGE_ARGS+=(
              -var="container_image_api=${TF_VAR_container_image_api}"
              -var="container_image_outbox=${TF_VAR_container_image_outbox}"
              -var="container_image_fulfillment=${TF_VAR_container_image_fulfillment}"
              -var="container_image_cloudshield=${TF_VAR_container_image_cloudshield}"
              -var="container_image_networkguard=${TF_VAR_container_image_networkguard}"
            )
            if [ -n "${TF_VAR_container_image_reconciliation}" ]; then
              EXTRA_IMAGE_ARGS+=(-var="container_image_reconciliation=${TF_VAR_container_image_reconciliation}")
            fi
            if [ -n "${TF_VAR_container_image_notification}" ]; then
              EXTRA_IMAGE_ARGS+=(-var="container_image_notification=${TF_VAR_container_image_notification}")
            fi
          fi
          terraform plan \
            -var="environment=${{ inputs.environment }}" \
            -var="enable_ecs_services=${{ inputs.enable_ecs_services }}" \
            -var="enable_alb=${{ inputs.enable_alb }}" \
            "${EXTRA_IMAGE_ARGS[@]}" \
            -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform apply -auto-approve tfplan

  note:
    name: Deploy notes
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          echo "Populate Secrets Manager JWT + connection strings outside Terraform."
          echo "Use push_images=true after enable_ecr (default) creates repositories."
          echo "Keep enable_alb=false and enable_ecs_services=false unless intentionally spending."
          echo "See infra/terraform/COST.md and docs/deployment.md."
