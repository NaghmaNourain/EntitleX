# Same-origin SPA host. When co-locating with the API, uncomment the /api and
# /health proxies and point upstream entitlex_api at the API service.
# Production does not rely on browser CORS (API registers CORS only in Development).
# Listen on 8080 so the image can run as the non-root nginx user.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # upstream entitlex_api { server api:8080; }
  # location /api/ {
  #   proxy_pass http://entitlex_api;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
  # location /health {
  #   proxy_pass http://entitlex_api;
  # }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
